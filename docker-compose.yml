services:
  postgres:
    image: postgres:16-alpine
    container_name: spti_postgres
    environment:
      POSTGRES_USER: spti
      POSTGRES_PASSWORD: spti
      POSTGRES_DB: spti
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spti -d spti"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
